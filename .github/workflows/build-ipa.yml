name: Build IPA

# CI only. This workflow lives on the fork's main branch and is not part of the
# app change, so the feature branch diff stays minimal.
#
#   gh workflow run build-ipa.yml -R <owner>/LinuxRunner --ref main -f target=<branch>

on:
  workflow_dispatch:
    inputs:
      target:
        description: Branch or tag to build
        required: true
        default: terminal-smoother
      metal:
        description: Build the Metal/JIT variant (slow, cached afterwards)
        type: boolean
        default: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      # Pinned upstream revisions for the GPU dependencies (docs/BUILDING.md).
      ANGLE_REV: feebf60fe088ccec3a26a7419d6ac68edf542c7a
      VIRGL_REV: e0a1caf3b147bb26dfe524dbb85ded1177e7e49e
      EPOXY_REV: d1f952c4565c389d82fd1657153e84e050f35b27
      DEPOT_TOOLS_REV: a20039648c0de69d8156906b18052bd47e9bf230
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}

      - name: Checkout pinned submodules
        run: |
          git submodule update --init --recursive --checkout -- \
            deps/libapps deps/libarchive deps/glslang deps/spirv-cross

      - name: Install build tools
        run: |
          # scripts/bootstrap-macos.sh requires: meson ninja cmake ld.lld
          brew install meson ninja cmake pkg-config lld
          # virglrenderer's meson needs PyYAML.
          brew install pyyaml || python3 -m pip install --user --break-system-packages pyyaml
          python3 -c 'import yaml; print("pyyaml", yaml.__version__)'
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # The static ANGLE/libepoxy/virglrenderer archives take a long time to
      # build and never change for a given revision set, so keep them.
      - name: Restore GPU libraries
        id: gpu-cache
        if: inputs.metal
        uses: actions/cache@v4
        with:
          path: build/gpu/iphoneos
          key: gpu-iphoneos-angle-${{ env.ANGLE_REV }}-virgl-${{ env.VIRGL_REV }}-epoxy-${{ env.EPOXY_REV }}

      - name: Restore ANGLE build output
        if: inputs.metal && steps.gpu-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gpu-deps/angle/out
          key: angle-out-${{ env.ANGLE_REV }}

      - name: Build GPU dependencies (Metal)
        if: inputs.metal && steps.gpu-cache.outputs.cache-hit != 'true'
        env:
          GPU_DEPS: ${{ runner.temp }}/gpu-deps
        run: |
          set -euo pipefail
          fetch() { # url, dir, revision
            mkdir -p "$2"
            git -C "$2" init -q
            git -C "$2" remote add origin "$1" 2>/dev/null || git -C "$2" remote set-url origin "$1"
            git -C "$2" fetch -q --depth 1 origin "$3"
            git -C "$2" checkout -q --detach FETCH_HEAD
          }
          fetch https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GPU_DEPS/depot_tools" "$DEPOT_TOOLS_REV"
          fetch https://chromium.googlesource.com/angle/angle "$GPU_DEPS/angle" "$ANGLE_REV"
          fetch https://gitlab.freedesktop.org/virgl/virglrenderer.git "$GPU_DEPS/virglrenderer" "$VIRGL_REV"
          fetch https://github.com/anholt/libepoxy.git "$GPU_DEPS/libepoxy" "$EPOXY_REV"
          export PATH="$GPU_DEPS/depot_tools:$PATH"
          # chromium.googlesource.com answers HTTP 500 for this pinned repo on
          # every attempt. It is a formatting helper, not part of the ANGLE
          # build, so drop it from DEPS before syncing.
          python3 - "$GPU_DEPS/angle/DEPS" <<'PYDEPS'
          import re, sys
          path = sys.argv[1]
          text = open(path).read()
          stripped = re.sub(r"\n  'third_party/clang-format/script': \{.*?\n  \},\n", "\n", text, flags=re.S)
          if stripped == text:
              print('clang-format entry not found (already removed?)')
          else:
              open(path, 'w').write(stripped)
              print('removed third_party/clang-format/script from DEPS')
          PYDEPS
          (cd "$GPU_DEPS/angle" && python3 scripts/bootstrap.py)
          # gclient fetches dozens of pinned repos; individual ones fail with
          # transient HTTP 500s often enough to be worth retrying.
          for attempt in 1 2 3 4; do
            if (cd "$GPU_DEPS/angle" && gclient sync --no-history --reset --force); then
              break
            fi
            echo "gclient sync attempt $attempt failed; retrying"
            sleep $((attempt * 20))
            if [ "$attempt" = 4 ]; then exit 1; fi
          done
          df -h /
          # The script discards stdout on the virglrenderer configure step, and
          # meson reports failures on stdout, so the reason was invisible.
          sed -i '' 's|-Dplatforms=egl -Dvenus=false -Dvideo=false -Dtests=false >/dev/null|-Dplatforms=egl -Dvenus=false -Dvideo=false -Dtests=false|' scripts/build-gpu-deps.sh
          # Capture everything: a failing meson setup printed nothing useful.
          set +e
          bash -x scripts/build-gpu-deps.sh iphoneos > "$RUNNER_TEMP/gpu-build.log" 2>&1
          status=$?
          tail -120 "$RUNNER_TEMP/gpu-build.log"
          exit $status

      - name: Build unsigned IPA
        env:
          VIRGL: ${{ inputs.metal && 'YES' || 'NO' }}
        run: LINUXRUNNER_VIRGL="$VIRGL" LINUXRUNNER_JIT="$VIRGL" scripts/build-ipa.sh --unsigned

      - name: Verify IPA
        env:
          # verify-ipa.py cross-checks the meson JIT options against this.
          LINUXRUNNER_JIT: ${{ inputs.metal && 'YES' || 'NO' }}
        run: python3 scripts/verify-ipa.py build/releases

      # Release assets are served as plain files; artifacts are always zipped.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          SHA=$(git rev-parse HEAD)
          gh release create "$TAG" \
            --target "$SHA" \
            --title "LinuxRunner build ${{ github.run_number }} (${{ inputs.target }})${{ inputs.metal && ' · Metal' || '' }}" \
            --notes "Unsigned IPA built from \`${{ inputs.target }}\` at $SHA.
          Metal/JIT: ${{ inputs.metal }}

          Source (GPL-3.0): https://github.com/${{ github.repository }}/tree/$SHA" \
            build/releases/LinuxRunner.ipa \
            build/releases/LinuxRunner.ipa.sha256
          echo "Download: https://github.com/${{ github.repository }}/releases/download/$TAG/LinuxRunner.ipa" >> "$GITHUB_STEP_SUMMARY"
